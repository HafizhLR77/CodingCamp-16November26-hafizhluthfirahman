<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Dashboard</h1>
      <button id="theme-toggle">🌙 Dark</button>
    </header>

    <main class="dashboard-grid">
      <section id="greeting-widget">
        <h2>Greeting</h2>
        <p id="greeting-time" class="greeting-time" aria-live="polite"></p>
        <p id="greeting-date" class="greeting-date"></p>
        <p id="greeting-text" class="greeting-text"></p>
        <div class="greeting-name-form">
          <input
            type="text"
            id="greeting-name-input"
            class="greeting-name-input"
            placeholder="Enter your name…"
            maxlength="50"
            aria-label="Your name"
          />
          <button id="greeting-name-submit" class="greeting-name-submit" type="button">Save</button>
          <span id="greeting-name-error" class="field-error" role="alert"></span>
        </div>
      </section>

      <section id="timer-widget">
        <h2>Focus Timer</h2>
        <p id="timer-display" class="timer-display" aria-live="polite">25:00</p>
        <div class="timer-controls">
          <button id="timer-start" type="button">▶ Start</button>
          <button id="timer-stop" type="button">⏸ Stop</button>
          <button id="timer-reset" type="button">↺ Reset</button>
        </div>
        <div class="timer-duration-form">
          <label for="timer-duration-input">Duration (min):</label>
          <input
            type="number"
            id="timer-duration-input"
            class="timer-duration-input"
            min="1"
            max="120"
            value="25"
            aria-label="Pomodoro duration in minutes"
          />
          <span id="timer-duration-error" class="field-error" role="alert"></span>
        </div>
      </section>

      <section id="todo-widget">
        <h2>To-Do List</h2>
        <form id="todo-input-form" class="todo-input-form" novalidate>
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="Add a new task…"
            maxlength="500"
            aria-label="New task description"
          />
          <button type="submit" class="todo-add-btn">Add</button>
        </form>
        <div id="todo-list" class="todo-list" aria-label="Task list"></div>
        <p id="todo-count-badge" class="todo-count-badge" aria-live="polite">0 tasks remaining</p>
      </section>

      <section id="quicklinks-widget">
        <h2>Quick Links</h2>
        <form id="quicklinks-add-form" class="quicklinks-add-form" novalidate>
          <div class="quicklinks-field">
            <label for="quicklinks-label-input">Label</label>
            <input
              type="text"
              id="quicklinks-label-input"
              class="quicklinks-label-input"
              placeholder="e.g. GitHub"
              maxlength="100"
              aria-label="Quick link label"
            />
            <span id="quicklinks-label-error" class="field-error" role="alert"></span>
          </div>
          <div class="quicklinks-field">
            <label for="quicklinks-url-input">URL</label>
            <input
              type="text"
              id="quicklinks-url-input"
              class="quicklinks-url-input"
              placeholder="e.g. github.com"
              aria-label="Quick link URL"
            />
            <span id="quicklinks-url-error" class="field-error" role="alert"></span>
          </div>
          <button type="submit" id="quicklinks-add-btn" class="quicklinks-add-btn">Add Link</button>
        </form>
        <div id="quicklinks-list" class="quicklinks-list" aria-label="Quick links list"></div>
      </section>
    </main>

    <div id="storage-error-notice" aria-live="polite" hidden></div>

    <script src="js/app.js" defer></script>
  </body>
</html>
